<!--
  The password-reset email (PRD 10, Section 1). Wired into supabase/config.toml
  for the local stack; the same file is pasted into the hosted dashboard
  (Authentication, Emails, Reset password), subject "Reset your Noteworthy password".
  No template braces in this comment: the template engine reads comments too.

  The link opens the app's /auth/confirm, whose button verifies; nothing here
  verifies on a GET, so a mail scanner opening it spends nothing.

  RedirectTo is the redirectTo the app passed (origin + /auth/confirm, the
  deployment the request reached) when it is on the allow list, and the Site
  URL otherwise. In that case the link goes to the Site URL's own /auth/confirm,
  which works on the same project. So the Site URL must be an origin with no
  trailing slash.

  "1 hour" is fixed text. It must match the email OTP expiry (otp_expiry, 3600
  seconds), locally and on hosted: no template variable gives it.
-->
<h2>Reset your Noteworthy password</h2>
<p>
	Someone asked to reset the password for your Noteworthy account. To choose a new one, open this
	link:
</p>
<p>
	<a
		href="{{ if eq .RedirectTo .SiteURL }}{{ .SiteURL }}/auth/confirm{{ else }}{{ .RedirectTo }}{{ end }}?token_hash={{ .TokenHash }}&amp;type=recovery"
		>Reset your password</a
	>
</p>
<p>This link works for 1 hour.</p>
<p>If you didn't ask for this, ignore this email.</p>
